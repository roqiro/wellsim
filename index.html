<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plate Designer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <style>
        .show-on-export { display: none; }
        .well-button { touch-action: none; }
        .exporting .hide-on-export { display: none; }
        .exporting .well-button[data-active="true"] {
            transform: none;
            border-color: #f1f5f9;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }
        .select-none {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Lucide Icons as React Components ---
        const FlaskConical = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M10 2v8L4.5 20.29A2 2 0 0 0 6 23h12a2 2 0 0 0 1.5-2.71L14 10V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>
            </svg>
        );
        const Layers = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/>
            </svg>
        );
        const ImageIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
            </svg>
        );
        const FileText = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/>
            </svg>
        );
        const Upload = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
        );
        const RotateCcw = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
            </svg>
        );

        const Shuffle = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/>
            </svg>
        );

        const PLATE_CONFIGS = {
            6: { rows: 2, cols: 3 },
            12: { rows: 3, cols: 4 },
            24: { rows: 4, cols: 6 },
            48: { rows: 6, cols: 8 },
            96: { rows: 8, cols: 12 }
        };

        const WELL_COLORS = [
            { name: 'Blank', value: '#ffffff' },
            { name: 'Red', value: '#ef4444' },
            { name: 'Blue', value: '#3b82f6' },
            { name: 'Green', value: '#22c55e' },
            { name: 'Yellow', value: '#eab308' },
            { name: 'Purple', value: '#a855f7' },
            { name: 'Orange', value: '#f97316' },
            { name: 'Pink', value: '#ec4899' },
            { name: 'Cyan', value: '#06b6d4' },
            { name: 'Indigo', value: '#6366f1' },
        ];

        const STORAGE_KEY = 'wellsim:v2';
        const LEGACY_STORAGE_KEY = 'wellsim:v1';
        const BLANK = '#ffffff';
        const GROUP_COLORS = WELL_COLORS.filter((c) => c.value !== BLANK).map((c) => c.value);

        // Cached: the balance search parses the same few hundred IDs millions of times
        const parsedWellIds = new Map();
        const parseWellId = (id) => {
            if (parsedWellIds.has(id)) return parsedWellIds.get(id);
            const match = /^([A-Z])(\d{1,2})$/.exec(id);
            const parsed = match ? { row: match[1].charCodeAt(0) - 64, col: Number(match[2]) } : null;
            parsedWellIds.set(id, parsed);
            return parsed;
        };

        const fitsPlate = (id, size) => {
            const pos = parseWellId(id);
            const { rows, cols } = PLATE_CONFIGS[size];
            return pos !== null && pos.row <= rows && pos.col >= 1 && pos.col <= cols;
        };

        const smallestPlateFor = (ids) =>
            Object.keys(PLATE_CONFIGS)
                .map(Number)
                .find((size) => ids.every((id) => fitsPlate(id, size)));

        const isUsedWell = (well) => well.color !== BLANK || well.label !== '';

        const wellIdsFor = (size) => {
            const { rows, cols } = PLATE_CONFIGS[size];
            return Array.from({ length: rows * cols }, (_, i) =>
                `${String.fromCharCode(65 + Math.floor(i / cols))}${(i % cols) + 1}`);
        };

        const isEdgeWell = (id, size) => {
            const { row, col } = parseWellId(id);
            const { rows, cols } = PLATE_CONFIGS[size];
            return row === 1 || row === rows || col === 1 || col === cols;
        };

        // mulberry32: small seeded PRNG so a layout can be reproduced from its seed
        const createRng = (seed) => {
            let a = seed >>> 0;
            return () => {
                a = (a + 0x6D2B79F5) >>> 0;
                let t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        };

        const shuffle = (items, rng) => {
            const result = [...items];
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        };

        const randomSeed = () => Math.floor(Math.random() * 1000000);

        const parseList = (text, separator) => text.split(separator).map((s) => s.trim()).filter(Boolean);

        const planDesign = ({ groups, replicates, plateSize, excludeEdges }) => {
            const slots = wellIdsFor(plateSize).filter((id) => !(excludeEdges && isEdgeWell(id, plateSize)));
            const wellsPerSet = groups.length * replicates;
            const platesPerSet = slots.length > 0 ? Math.ceil(wellsPerSet / slots.length) : 0;
            return { slots, wellsPerSet, platesPerSet };
        };

        // Spread each group's replicates over as many plates as possible, keeping plate fill balanced
        const assignToPlates = (groupCount, replicates, plateCount, rng) => {
            const capacity = Math.ceil((groupCount * replicates) / plateCount);
            const plates = Array.from({ length: plateCount }, () => []);
            const score = (p, g) => plates[p].filter((x) => x === g).length * 1000 + plates[p].length;
            for (let r = 0; r < replicates; r++) {
                shuffle([...Array(groupCount).keys()], rng).forEach((g) => {
                    const candidates = shuffle([...Array(plateCount).keys()], rng)
                        .filter((p) => plates[p].length < capacity);
                    const best = candidates.reduce((a, b) => (score(b, g) < score(a, g) ? b : a));
                    plates[best].push(g);
                });
            }
            return plates;
        };

        const groupKeyOf = (well) => well.label || WELL_COLORS.find((c) => c.value === well.color)?.name || well.color;

        // Fewest same-line pairs possible when k wells are spread over n lines
        const minLinePairs = (k, n) => {
            if (k === 0) return 0;
            const q = Math.floor(k / n);
            const r = k % n;
            return r * ((q + 1) * q) / 2 + (n - r) * (q * (q - 1)) / 2;
        };

        // Per-group position metrics; penalty is what constrained randomization minimises
        const analyzeBalance = (plates, plateSize) => {
            const groups = new Map();
            const occupiedLines = plates.map(() => ({ rows: new Set(), cols: new Set() }));
            const occupiedPositions = new Set();
            const positionCounts = new Map();
            let used = 0;
            let usedEdge = 0;
            plates.forEach((plate, p) => {
                const lineCounts = new Map();
                Object.entries(plate.wells).forEach(([id, well]) => {
                    if (!isUsedWell(well) || !fitsPlate(id, plateSize)) return;
                    const key = groupKeyOf(well);
                    const group = groups.get(key) || { key, color: well.color, count: 0, edge: 0, linePairs: 0, adjacentPairs: 0, positionRepeats: 0, perPlate: plates.map(() => 0) };
                    const { row, col } = parseWellId(id);
                    const edge = isEdgeWell(id, plateSize);
                    group.count++;
                    group.edge += edge ? 1 : 0;
                    group.perPlate[p]++;
                    occupiedLines[p].rows.add(row);
                    occupiedLines[p].cols.add(col);
                    occupiedPositions.add(id);
                    const positionKey = `${key}|${id}`;
                    const seenAtPosition = positionCounts.get(positionKey) || 0;
                    group.positionRepeats += seenAtPosition;
                    positionCounts.set(positionKey, seenAtPosition + 1);
                    [`r${row}`, `c${col}`].forEach((line) => {
                        const lineKey = `${key}|${line}`;
                        const seen = lineCounts.get(lineKey) || 0;
                        group.linePairs += seen;
                        lineCounts.set(lineKey, seen + 1);
                    });
                    [`${String.fromCharCode(65 + row)}${col}`, `${String.fromCharCode(64 + row)}${col + 1}`].forEach((neighborId) => {
                        const neighbor = plate.wells[neighborId];
                        if (neighbor && isUsedWell(neighbor) && groupKeyOf(neighbor) === key) group.adjacentPairs++;
                    });
                    used++;
                    usedEdge += edge ? 1 : 0;
                    groups.set(key, group);
                });
            });
            const edgeShare = used > 0 ? usedEdge / used : 0;
            const rows = [...groups.values()].map((group) => ({
                ...group,
                expectedEdge: group.count * edgeShare,
                minLinePairs: group.perPlate.reduce((sum, k, p) =>
                    sum + minLinePairs(k, occupiedLines[p].rows.size) + minLinePairs(k, occupiedLines[p].cols.size), 0),
                minPositionRepeats: minLinePairs(group.count, occupiedPositions.size),
                platesUsed: group.perPlate.filter(Boolean).length,
                maxPerPlate: Math.max(...group.perPlate),
            }));
            const layoutPenalty = rows.reduce((sum, g) =>
                sum + 2 * (g.edge - g.expectedEdge) ** 2 + (g.linePairs - g.minLinePairs) + 2 * g.adjacentPairs, 0);
            const repeatPenalty = rows.reduce((sum, g) => sum + 2 * (g.positionRepeats - g.minPositionRepeats), 0);
            return { rows, edgeShare, layoutPenalty, repeatPenalty, penalty: layoutPenalty + repeatPenalty };
        };

        const BALANCE_CANDIDATES = 100;
        const BALANCE_SWAP_STEPS = 3000;

        // Caps the final whole-design pass so large designs stay responsive
        const POLISH_WELL_BUDGET = 200000;

        // Hill-climb by swapping two slots within a plate; equal-penalty swaps are kept
        // so the search can drift across plateaus instead of stalling
        const improveBySwaps = (layout, slots, score, rng, steps) => {
            let bestPenalty = score(layout);
            for (let step = 0; step < steps && bestPenalty > 0; step++) {
                const wells = layout[Math.floor(rng() * layout.length)].wells;
                const a = slots[Math.floor(rng() * slots.length)];
                const b = slots[Math.floor(rng() * slots.length)];
                if (a === b || wells[a]?.label === wells[b]?.label) continue;
                const swap = () => {
                    const [wa, wb] = [wells[a], wells[b]];
                    if (wb) wells[a] = wb; else delete wells[a];
                    if (wa) wells[b] = wa; else delete wells[b];
                };
                swap();
                const penalty = score(layout);
                if (penalty <= bestPenalty) bestPenalty = penalty;
                else swap();
            }
            return layout;
        };

        const designSetNames = (experiments, timepoints) => {
            const experimentNames = experiments > 1 ? Array.from({ length: experiments }, (_, e) => `Exp${e + 1}`) : [''];
            const timepointNames = timepoints.length > 0 ? timepoints : [''];
            return experimentNames.flatMap((exp) => timepointNames.map((tp) => [exp, tp].filter(Boolean).join('-')));
        };

        // Counts same-group/same-position pairs, optionally on top of earlier plates' counts
        const tallyPositions = (plates, prior = new Map()) => {
            const counts = new Map();
            let pairs = 0;
            plates.forEach((plate) => Object.entries(plate.wells).forEach(([id, well]) => {
                if (!isUsedWell(well)) return;
                const key = `${groupKeyOf(well)}|${id}`;
                const seen = counts.get(key) || 0;
                pairs += seen + (prior.get(key) || 0);
                counts.set(key, seen + 1);
            }));
            return { counts, pairs };
        };

        // Sets are optimised one after another so that later plates avoid the positions
        // each group already took on earlier plates (randomized Latin-square-like rotation),
        // then a whole-design pass repairs dead ends left by the sequential greedy step
        const generateDesign = ({ groups, replicates, experiments, timepoints, plateSize, excludeEdges, balancePositions, rotatePositions, seed }) => {
            const rng = createRng(seed);
            const { slots, platesPerSet } = planDesign({ groups, replicates, plateSize, excludeEdges });
            const optimize = balancePositions || rotatePositions;
            const plates = designSetNames(experiments, timepoints).reduce((done, setName) => {
                const { counts: prior } = tallyPositions(done);
                const setScore = (setPlates) =>
                    (balancePositions ? analyzeBalance(setPlates, plateSize).layoutPenalty : 0) +
                    (rotatePositions ? 2 * tallyPositions(setPlates, prior).pairs : 0);
                const plateGroups = assignToPlates(groups.length, replicates, platesPerSet, rng);
                const plateName = (i) => {
                    if (!setName) return `Plate ${done.length + i + 1}`;
                    return platesPerSet > 1 ? `${setName}-${i + 1}` : setName;
                };
                const buildLayout = () => plateGroups.map((groupIndexes, i) => {
                    const positions = shuffle(slots, rng);
                    const wells = {};
                    groupIndexes.forEach((g, k) => {
                        wells[positions[k]] = { color: GROUP_COLORS[g % GROUP_COLORS.length], label: groups[g] };
                    });
                    return { name: plateName(i), wells };
                });
                let best = buildLayout();
                if (!optimize) return [...done, ...best];
                let bestPenalty = setScore(best);
                for (let k = 1; k < BALANCE_CANDIDATES; k++) {
                    const candidate = buildLayout();
                    const penalty = setScore(candidate);
                    if (penalty < bestPenalty) {
                        best = candidate;
                        bestPenalty = penalty;
                    }
                }
                return [...done, ...improveBySwaps(best, slots, setScore, rng, BALANCE_SWAP_STEPS)];
            }, []);
            if (!optimize || plates.length < 2) return plates;
            const fullScore = (layout) => {
                const { layoutPenalty, repeatPenalty } = analyzeBalance(layout, plateSize);
                return (balancePositions ? layoutPenalty : 0) + (rotatePositions ? repeatPenalty : 0);
            };
            const totalWells = groups.length * replicates * plates.length / platesPerSet;
            const polishSteps = Math.min(BALANCE_SWAP_STEPS, Math.round(POLISH_WELL_BUDGET / totalWells));
            return improveBySwaps(plates, slots, fullScore, rng, polishSteps);
        };

        const experimentOf = (plateName) => Number(/^Exp(\d+)/.exec(plateName)?.[1] ?? 0);

        // Seeding/measurement order: experiments kept together, plates in random order
        // within each experiment, wells shuffled within each plate
        const buildWorkOrder = (plates, plateSize, seed) => {
            const rng = createRng(seed ^ 0x5bd1e995);
            return shuffle([...plates.keys()], rng)
                .sort((a, b) => experimentOf(plates[a].name) - experimentOf(plates[b].name))
                .flatMap((p) =>
                shuffle(wellIdsFor(plateSize).filter((id) => plates[p].wells[id] && isUsedWell(plates[p].wells[id])), rng)
                    .map((id) => ({ plate: plates[p].name, id, well: plates[p].wells[id] })));
        };

        const buildLegend = (plates) => {
            const entries = new Map();
            plates.forEach((plate) => Object.values(plate.wells).forEach((well) => {
                if (!isUsedWell(well)) return;
                const key = `${well.color}|${well.label}`;
                const entry = entries.get(key) || { color: well.color, label: well.label, count: 0 };
                entries.set(key, { ...entry, count: entry.count + 1 });
            }));
            const colorOrder = (color) => WELL_COLORS.findIndex((c) => c.value === color);
            return [...entries.values()].sort((a, b) => colorOrder(a.color) - colorOrder(b.color));
        };

        const csvField = (value) => `"${String(value).replace(/"/g, '""')}"`;
        const unquote = (value = '') => value.trim().replace(/^"|"$/g, '').replace(/""/g, '"');
        const splitCsvLine = (line) => line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(unquote);

        const emptyPlate = (index) => ({ name: `Plate ${index + 1}`, wells: {} });

        const DEFAULT_DESIGN = {
            groupsText: 'Control\nTreatment A\nTreatment B\nTreatment C',
            replicates: 3,
            timepointsText: '',
            experiments: 1,
            excludeEdges: false,
            balancePositions: true,
            rotatePositions: true,
            seed: randomSeed(),
        };

        const loadSavedState = () => {
            const fallback = { plateSize: 24, plates: [emptyPlate(0)], design: DEFAULT_DESIGN, designNote: '' };
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (saved && PLATE_CONFIGS[saved.plateSize] && Array.isArray(saved.plates) && saved.plates.length > 0) {
                    return { ...fallback, ...saved, design: { ...DEFAULT_DESIGN, ...saved.design } };
                }
                const legacy = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY));
                if (legacy && PLATE_CONFIGS[legacy.plateSize] && legacy.wells) {
                    return { ...fallback, plateSize: legacy.plateSize, plates: [{ ...emptyPlate(0), wells: legacy.wells }] };
                }
            } catch (e) {}
            return fallback;
        };

        const sectionLabel = 'text-[11px] font-black text-slate-400 uppercase mb-3 block tracking-widest';
        const textInput = 'w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm';

        const DesignPanel = ({ design, onChange, plateSize, onGenerate, isGenerating }) => {
            const groups = parseList(design.groupsText, /\r?\n/);
            const timepoints = parseList(design.timepointsText, ',');
            const { slots, wellsPerSet, platesPerSet } = planDesign({ groups, replicates: design.replicates, plateSize, excludeEdges: design.excludeEdges });
            const setCount = designSetNames(design.experiments, timepoints).length;
            const canGenerate = groups.length > 0 && design.replicates > 0 && slots.length > 0;
            const update = (patch) => onChange({ ...design, ...patch });

            return (
                <div className="pt-6 border-t border-slate-100 space-y-3">
                    <label className={`${sectionLabel} flex items-center gap-2`}>
                        <Shuffle size={14} className="text-indigo-500" />
                        Randomized Design
                    </label>
                    <div>
                        <span className="text-xs font-bold text-slate-500">Groups（1行に1群）</span>
                        <textarea
                            value={design.groupsText}
                            onChange={(e) => update({ groupsText: e.target.value })}
                            rows={4}
                            className={`${textInput} mt-1 resize-y`}
                        />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                        <label className="text-xs font-bold text-slate-500">
                            N / group
                            <input
                                type="number"
                                min={1}
                                value={design.replicates}
                                onChange={(e) => update({ replicates: Math.max(1, Number(e.target.value) || 1) })}
                                className={`${textInput} mt-1`}
                            />
                        </label>
                        <label className="text-xs font-bold text-slate-500">
                            Experiments
                            <input
                                type="number"
                                min={1}
                                value={design.experiments}
                                onChange={(e) => update({ experiments: Math.max(1, Number(e.target.value) || 1) })}
                                className={`${textInput} mt-1`}
                                title="独立実験の回数（実験ごとにプレートセットを作成）"
                            />
                        </label>
                        <label className="text-xs font-bold text-slate-500 col-span-2">
                            Seed
                            <div className="flex gap-1 mt-1">
                                <input
                                    type="number"
                                    value={design.seed}
                                    onChange={(e) => update({ seed: Number(e.target.value) || 0 })}
                                    className={`${textInput} px-2`}
                                />
                                <button
                                    onClick={() => update({ seed: randomSeed() })}
                                    className="px-2 rounded-xl border border-slate-200 bg-white hover:border-indigo-400 text-slate-500"
                                    title="New seed"
                                >
                                    <Shuffle size={14} />
                                </button>
                            </div>
                        </label>
                    </div>
                    <label className="text-xs font-bold text-slate-500 block">
                        Timepoints（カンマ区切り・空欄可）
                        <input
                            type="text"
                            value={design.timepointsText}
                            onChange={(e) => update({ timepointsText: e.target.value })}
                            placeholder="Day0, Day3, Day5"
                            className={`${textInput} mt-1`}
                        />
                    </label>
                    <label className="flex items-center gap-2 text-xs font-bold text-slate-500">
                        <input
                            type="checkbox"
                            checked={design.excludeEdges}
                            onChange={(e) => update({ excludeEdges: e.target.checked })}
                        />
                        Exclude edge wells
                    </label>
                    <label className="flex items-center gap-2 text-xs font-bold text-slate-500">
                        <input
                            type="checkbox"
                            checked={design.balancePositions}
                            onChange={(e) => update({ balancePositions: e.target.checked })}
                        />
                        Balance positions（外周比率・行列・隣接）
                    </label>
                    <label className="flex items-center gap-2 text-xs font-bold text-slate-500">
                        <input
                            type="checkbox"
                            checked={design.rotatePositions}
                            onChange={(e) => update({ rotatePositions: e.target.checked })}
                        />
                        Rotate positions across plates（ランダム化ラテン方格）
                    </label>
                    <p className="text-xs text-slate-500 bg-slate-50 rounded-xl p-3 border border-slate-200">
                        {slots.length === 0
                            ? 'このフォーマットでは使用できるウェルがありません。'
                            : `${groups.length}群 × N=${design.replicates}${design.experiments > 1 ? ` × ${design.experiments}実験` : ''}${timepoints.length > 0 ? ` × ${timepoints.length}時点` : ''} = ${wellsPerSet * setCount} wells → ${plateSize}-well × ${platesPerSet * setCount}枚`}
                    </p>
                    <button
                        onClick={() => onGenerate({
                            groups,
                            replicates: design.replicates,
                            experiments: design.experiments,
                            timepoints,
                            excludeEdges: design.excludeEdges,
                            balancePositions: design.balancePositions,
                            rotatePositions: design.rotatePositions,
                            seed: design.seed,
                        })}
                        disabled={!canGenerate || isGenerating}
                        className="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl transition-all disabled:opacity-40"
                    >
                        <Shuffle size={16} />
                        {isGenerating ? 'Generating...' : 'Generate Layout'}
                    </button>
                </div>
            );
        };

        const percent = (value) => `${Math.round(value * 100)}%`;

        const BalancePanel = ({ balance }) => {
            if (balance.rows.length === 0) return null;
            const warn = 'text-amber-600 font-black';
            const ok = 'text-slate-600';
            return (
                <div className="mt-10 pt-8 border-t border-slate-100">
                    <div className="flex flex-wrap items-baseline justify-between gap-2 mb-4">
                        <span className={`${sectionLabel} mb-0`}>Position Balance</span>
                        <span className="text-xs font-bold text-slate-400">
                            外周ウェル比率 {percent(balance.edgeShare)} · penalty {balance.penalty.toFixed(1)}（小さいほど均等・0 が理想）
                        </span>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-sm">
                            <thead>
                                <tr className="text-left text-[11px] font-black text-slate-400 uppercase tracking-wider">
                                    <th className="py-2 pr-4">Group</th>
                                    <th className="py-2 pr-4">N</th>
                                    <th className="py-2 pr-4">Edge wells（実測 / 期待）</th>
                                    <th className="py-2 pr-4">Same row/col</th>
                                    <th className="py-2 pr-4">Adjacent</th>
                                    <th className="py-2 pr-4">Same position</th>
                                    <th className="py-2">Plates（使用 / 最大）</th>
                                </tr>
                            </thead>
                            <tbody>
                                {balance.rows.map((g) => {
                                    const edgeOff = Math.abs(g.edge - g.expectedEdge) > 1;
                                    const actualShare = g.count > 0 ? g.edge / g.count : 0;
                                    return (
                                        <tr key={g.key} className="border-t border-slate-100">
                                            <td className="py-2 pr-4 font-bold text-slate-700">
                                                <span className="inline-block w-3 h-3 rounded-full mr-2 align-middle border border-slate-200" style={{ backgroundColor: g.color }}></span>
                                                {g.key}
                                            </td>
                                            <td className="py-2 pr-4 text-slate-600">{g.count}</td>
                                            <td className="py-2 pr-4">
                                                <div className="flex items-center gap-3">
                                                    <div className="relative w-24 h-2 rounded-full bg-slate-100">
                                                        <div className="absolute inset-y-0 left-0 rounded-full bg-indigo-400" style={{ width: percent(actualShare) }}></div>
                                                        <div className="absolute -inset-y-1 w-0.5 bg-slate-700" style={{ left: percent(balance.edgeShare) }} title="期待値"></div>
                                                    </div>
                                                    <span className={edgeOff ? warn : ok}>{g.edge} / {g.expectedEdge.toFixed(1)}</span>
                                                </div>
                                            </td>
                                            <td className={`py-2 pr-4 ${g.linePairs > g.minLinePairs ? warn : ok}`}>
                                                {g.linePairs} <span className="text-slate-400 font-medium">（最小 {g.minLinePairs}）</span>
                                            </td>
                                            <td className={`py-2 pr-4 ${g.adjacentPairs > 0 ? warn : ok}`}>{g.adjacentPairs}</td>
                                            <td className={`py-2 pr-4 ${g.positionRepeats > g.minPositionRepeats ? warn : ok}`}>
                                                {g.positionRepeats} <span className="text-slate-400 font-medium">（最小 {g.minPositionRepeats}）</span>
                                            </td>
                                            <td className="py-2 text-slate-600">{g.platesUsed} / {g.maxPerPlate} per plate</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                    <p className="mt-3 text-xs text-slate-400">
                        Edge: 外周ウェル数（期待値 = 全体の外周比率 × N、差が1を超えると警告）。Same row/col: 同一プレートで同じ行・列に並ぶペア数（ウェル数から避けられない最小値を超えると警告）。Adjacent: 上下左右に隣接するペア数。Same position: 別のプレートで同じウェル位置に入ったペア数。
                    </p>
                </div>
            );
        };

        const PlateGrid = ({ plate, plateIndex, plateSize, activeId, canRemove, onWellPointerDown, onWellPointerEnter, onRename, onRemove }) => {
            const config = PLATE_CONFIGS[plateSize];
            const rowLabels = Array.from({ length: config.rows }, (_, i) => String.fromCharCode(65 + i));
            const colLabels = Array.from({ length: config.cols }, (_, i) => i + 1);
            const wellClass = plateSize > 48 ? 'w-10 h-10' : plateSize > 24 ? 'w-12 h-12' : 'w-16 h-16';
            const labelClass = plateSize > 48 ? 'w-10 text-[7px]' : plateSize > 24 ? 'w-12 text-[9px]' : 'w-16 text-[9px]';

            return (
                <div className="inline-block border border-slate-200 rounded-3xl p-6 pb-8">
                    <div className="flex items-center justify-between mb-4 gap-4">
                        <input
                            type="text"
                            value={plate.name}
                            onChange={(e) => onRename(plateIndex, e.target.value)}
                            className="text-lg font-black text-slate-700 bg-transparent focus:outline-none focus:bg-slate-50 rounded-lg px-1 w-48"
                        />
                        {canRemove && (
                            <button
                                onClick={() => onRemove(plateIndex)}
                                className="hide-on-export text-xs font-bold text-slate-300 hover:text-rose-500"
                            >
                                Remove
                            </button>
                        )}
                    </div>

                    {/* Column Labels */}
                    <div className="flex mb-4 ml-12">
                        {colLabels.map((col) => (
                            <div
                                key={col}
                                className="text-center font-black text-slate-300 text-sm tracking-tighter"
                                style={{ width: plateSize > 48 ? '48px' : plateSize > 24 ? '56px' : '72px' }}
                            >
                                {col}
                            </div>
                        ))}
                    </div>

                    {/* Grid */}
                    {rowLabels.map((row) => (
                        <div key={row} className="flex items-center mb-6 last:mb-0">
                            <div className="w-12 font-black text-slate-300 text-xl">{row}</div>

                            <div className="flex gap-2">
                                {colLabels.map((col) => {
                                    const id = `${row}${col}`;
                                    const wellData = plate.wells[id] || { color: BLANK, label: '' };
                                    const isActive = activeId === id;

                                    return (
                                        <div key={id} className="relative flex flex-col items-center">
                                            <button
                                                onPointerDown={(e) => onWellPointerDown(e, plateIndex, id)}
                                                onPointerEnter={() => onWellPointerEnter(plateIndex, id)}
                                                data-active={isActive}
                                                className={`
                                                    well-button ${wellClass} rounded-full border-2 transition-all duration-150
                                                    flex flex-col items-center justify-center relative shadow-sm cursor-crosshair
                                                    ${isActive ? 'ring-4 ring-indigo-100 border-indigo-600 scale-110 z-20' : 'border-slate-100 hover:border-slate-300'}
                                                `}
                                                style={{ backgroundColor: wellData.color }}
                                            >
                                                <span className={`
                                                    ${plateSize > 48 ? 'text-[8px]' : 'text-[10px]'} font-bold select-none
                                                    ${wellData.color === BLANK ? 'text-slate-200' : 'text-white drop-shadow-md'}
                                                `}>
                                                    {id}
                                                </span>
                                            </button>
                                            {/* Visual Label */}
                                            {wellData.label && (
                                                <div className={`
                                                    absolute top-[105%] text-center leading-normal pb-0.5 font-bold text-slate-500 truncate
                                                    ${labelClass}
                                                `}>
                                                    {wellData.label}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const Legend = ({ entries }) => (
            <div className="flex flex-wrap justify-center gap-x-5 gap-y-2">
                {entries.map((entry) => (
                    <div key={`${entry.color}|${entry.label}`} className="flex items-center gap-2 text-sm font-bold text-slate-600">
                        <span className="w-4 h-4 rounded-full border border-slate-200" style={{ backgroundColor: entry.color }}></span>
                        {entry.label || WELL_COLORS.find((c) => c.value === entry.color)?.name || entry.color}
                        <span className="text-slate-400 font-medium">×{entry.count}</span>
                    </div>
                ))}
            </div>
        );

        const App = () => {
            const [initialState] = useState(loadSavedState);
            const [plateSize, setPlateSize] = useState(initialState.plateSize);
            const [plates, setPlates] = useState(initialState.plates);
            const [design, setDesign] = useState(initialState.design);
            const [designNote, setDesignNote] = useState(initialState.designNote);
            const [selectedColor, setSelectedColor] = useState(WELL_COLORS[1].value);
            const [activeWell, setActiveWell] = useState(null);
            const [isExporting, setIsExporting] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [isDragging, setIsDragging] = useState(false);
            const [groupLabelInput, setGroupLabelInput] = useState('');

            const plateRef = useRef(null);
            const fileInputRef = useRef(null);

            const activeData = activeWell ? plates[activeWell.plate]?.wells[activeWell.id] : null;
            const legend = buildLegend(plates);
            const balance = analyzeBalance(plates, plateSize);
            const occupancy = plates.reduce((sum, plate) =>
                sum + Object.values(plate.wells).filter((w) => w.color !== BLANK).length, 0);

            useEffect(() => {
                const handleGlobalPointerUp = () => setIsDragging(false);
                window.addEventListener('pointerup', handleGlobalPointerUp);
                window.addEventListener('pointercancel', handleGlobalPointerUp);
                return () => {
                    window.removeEventListener('pointerup', handleGlobalPointerUp);
                    window.removeEventListener('pointercancel', handleGlobalPointerUp);
                };
            }, []);

            useEffect(() => {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ plateSize, plates, design, designNote }));
                } catch (e) {}
            }, [plateSize, plates, design, designNote]);

            const hasData = () => plates.some((plate) => Object.values(plate.wells).some(isUsedWell));

            const updatePlateWells = (plateIndex, updater) => {
                setPlates((prev) => prev.map((plate, i) => (i === plateIndex ? { ...plate, wells: updater(plate.wells) } : plate)));
            };

            const changePlateSize = (size) => {
                if (size === plateSize) return;
                const lost = plates.flatMap((plate) =>
                    Object.keys(plate.wells)
                        .filter((id) => isUsedWell(plate.wells[id]) && !fitsPlate(id, size))
                        .map((id) => `${plate.name}:${id}`));
                if (lost.length > 0 && !confirm(`${size}ウェルに収まらない ${lost.length} 個のウェル（${lost.slice(0, 5).join(', ')}${lost.length > 5 ? ' ...' : ''}）のデータが削除されます。続けますか？`)) {
                    return;
                }
                setPlates((prev) => prev.map((plate) => ({
                    ...plate,
                    wells: Object.fromEntries(Object.entries(plate.wells).filter(([id]) => fitsPlate(id, size)))
                })));
                if (activeWell && !fitsPlate(activeWell.id, size)) setActiveWell(null);
                setPlateSize(size);
            };

            const updateWellColor = (plateIndex, id, color) => {
                updatePlateWells(plateIndex, (wells) => ({
                    ...wells,
                    [id]: { ...wells[id], color, label: wells[id]?.label || '' }
                }));
            };

            const handleWellPointerDown = (e, plateIndex, id) => {
                // Release implicit touch capture so pointerenter fires on neighbouring wells
                if (e.currentTarget.hasPointerCapture(e.pointerId)) {
                    e.currentTarget.releasePointerCapture(e.pointerId);
                }
                setIsDragging(true);
                setActiveWell({ plate: plateIndex, id });
                const current = plates[plateIndex].wells[id]?.color;
                const newColor = current === selectedColor && selectedColor !== BLANK ? BLANK : selectedColor;
                updateWellColor(plateIndex, id, newColor);
            };

            const handleWellPointerEnter = (plateIndex, id) => {
                if (isDragging) {
                    updateWellColor(plateIndex, id, selectedColor);
                }
            };

            const handleLabelChange = (e) => {
                if (!activeWell) return;
                const value = e.target.value;
                updatePlateWells(activeWell.plate, (wells) => ({
                    ...wells,
                    [activeWell.id]: { color: BLANK, ...wells[activeWell.id], label: value }
                }));
            };

            const applyGroupLabel = () => {
                if (selectedColor === BLANK) {
                    return;
                }
                setPlates((prev) => prev.map((plate) => ({
                    ...plate,
                    wells: Object.fromEntries(Object.entries(plate.wells).map(([id, well]) => [
                        id,
                        well.color === selectedColor ? { ...well, label: groupLabelInput } : well
                    ]))
                })));
                setGroupLabelInput('');
            };

            const renamePlate = (plateIndex, name) => {
                setPlates((prev) => prev.map((plate, i) => (i === plateIndex ? { ...plate, name } : plate)));
            };

            const addPlate = () => setPlates((prev) => [...prev, emptyPlate(prev.length)]);

            const removePlate = (plateIndex) => {
                if (Object.values(plates[plateIndex].wells).some(isUsedWell) && !confirm(`${plates[plateIndex].name} を削除しますか？`)) {
                    return;
                }
                setPlates((prev) => prev.filter((_, i) => i !== plateIndex));
                setActiveWell(null);
            };

            const resetPlates = () => {
                if (confirm('すべてのプレートをリセットしてもよろしいですか？すべてのデータが消去されます。')) {
                    setPlates([emptyPlate(0)]);
                    setDesignNote('');
                    setActiveWell(null);
                }
            };

            const handleGenerate = (params) => {
                if (hasData() && !confirm('現在のプレートを上書きして、ランダム配置を生成しますか？')) {
                    return;
                }
                setIsGenerating(true);
                // Defer so the "Generating..." state paints before the search blocks the thread
                setTimeout(() => {
                    setPlates(generateDesign({ ...params, plateSize }));
                    setDesignNote([
                        `${params.groups.length} groups × N=${params.replicates}${params.experiments > 1 ? ` × ${params.experiments} experiments` : ''}`,
                        params.excludeEdges && 'edge wells excluded',
                        params.balancePositions && 'position-balanced',
                        params.rotatePositions && 'positions rotated across plates',
                        `seed ${params.seed}`,
                    ].filter(Boolean).join(' · '));
                    setActiveWell(null);
                    setIsGenerating(false);
                }, 30);
            };

            const exportToCSV = () => {
                const headers = ['Plate', 'Well_ID', 'Color_HEX', 'Label'];
                const rows = plates.flatMap((plate) =>
                    wellIdsFor(plateSize)
                        .filter((id) => plate.wells[id] && isUsedWell(plate.wells[id]))
                        .map((id) => [csvField(plate.name), id, plate.wells[id].color, csvField(plate.wells[id].label || '')].join(',')));
                const csvContent = [headers.join(','), ...rows].join('\n');

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `plate_layout_${plateSize}well_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
            };

            const exportWorkOrder = () => {
                const headers = ['Order', 'Plate', 'Well_ID', 'Label', 'Color_HEX', 'Done'];
                const rows = buildWorkOrder(plates, plateSize, design.seed).map((step, i) =>
                    [i + 1, csvField(step.plate), step.id, csvField(step.well.label || ''), step.well.color, ''].join(','));
                // BOM so Excel opens Japanese labels correctly
                const csvContent = '﻿' + [headers.join(','), ...rows].join('\n');

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `work_order_seed${design.seed}_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
            };

            const importFromCSV = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const lines = e.target.result.split(/\r?\n/);
                    const hasPlateColumn = splitCsvLine((lines[0] || '').replace(/^﻿/, ''))[0].toLowerCase() === 'plate';
                    const byName = new Map();

                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        const fields = splitCsvLine(lines[i]);
                        const [plateName, rawId, color, label] = hasPlateColumn ? fields : ['Plate 1', ...fields];
                        const id = (rawId || '').toUpperCase();
                        if (!fitsPlate(id, 96)) continue;
                        const name = plateName || 'Plate 1';
                        if (!byName.has(name)) byName.set(name, {});
                        byName.get(name)[id] = { color: color || BLANK, label: label || '' };
                    }

                    const newPlates = [...byName.entries()].map(([name, wells]) => ({ name, wells }));
                    if (newPlates.length === 0) return;
                    const size = smallestPlateFor(newPlates.flatMap((plate) => Object.keys(plate.wells)));
                    if (size > plateSize) setPlateSize(size);
                    setActiveWell(null);
                    setDesignNote('');
                    setPlates(newPlates);
                };
                reader.readAsText(file);
                event.target.value = null;
            };

            const downloadAsImage = async () => {
                setIsExporting(true);
                if (!window.html2canvas) {
                    const script = document.createElement('script');
                    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                    document.head.appendChild(script);
                    await new Promise((resolve) => (script.onload = resolve));
                }

                try {
                    const canvas = await window.html2canvas(plateRef.current, {
                        backgroundColor: '#ffffff',
                        scale: 2,
                        logging: false,
                        onclone: (doc) => {
                            doc.body.classList.add('exporting');
                            doc.querySelectorAll('.show-on-export').forEach((el) => {
                                el.style.display = 'block';
                            });
                        },
                    });
                    const link = document.createElement('a');
                    link.download = `plate_image_${plateSize}well_${plates.length}plates.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                } catch (err) {
                    console.error('Image export failed', err);
                } finally {
                    setIsExporting(false);
                }
            };

            return (
                <div className="min-h-screen bg-[#f8fafc] text-[#1e293b] p-4 md:p-8 font-sans select-none">
                    <div className="max-w-[1600px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">

                        {/* Sidebar */}
                        <aside className="lg:col-span-3 space-y-6">
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                                <div className="flex items-center gap-3 mb-8">
                                    <div className="p-2 bg-indigo-600 rounded-lg text-white">
                                        <FlaskConical size={24} />
                                    </div>
                                    <h1 className="text-xl font-bold tracking-tight">Plate Designer</h1>
                                </div>

                                <div className="space-y-6">
                                    {/* Format Selection */}
                                    <div>
                                        <label className={sectionLabel}>Plate Format</label>
                                        <div className="grid grid-cols-3 gap-2">
                                            {[6, 12, 24, 48, 96].map((size) => (
                                                <button
                                                    key={size}
                                                    onClick={() => changePlateSize(size)}
                                                    className={`py-2.5 rounded-xl text-sm font-bold transition-all ${
                                                        plateSize === size
                                                            ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200 scale-105'
                                                            : 'bg-slate-50 text-slate-500 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    {size}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <DesignPanel
                                        design={design}
                                        onChange={setDesign}
                                        plateSize={plateSize}
                                        onGenerate={handleGenerate}
                                        isGenerating={isGenerating}
                                    />

                                    {/* Palette */}
                                    <div className="pt-6 border-t border-slate-100">
                                        <label className={sectionLabel}>Active Color</label>
                                        <div className="grid grid-cols-5 gap-3">
                                            {WELL_COLORS.map((color) => (
                                                <button
                                                    key={color.value}
                                                    onClick={() => setSelectedColor(color.value)}
                                                    className={`w-full aspect-square rounded-full border-4 transition-all hover:scale-110 ${
                                                        selectedColor === color.value ? 'border-indigo-100 ring-2 ring-indigo-600' : 'border-transparent shadow-inner'
                                                    }`}
                                                    style={{ backgroundColor: color.value }}
                                                    title={color.name}
                                                />
                                            ))}
                                        </div>
                                    </div>

                                    {/* Group Label */}
                                    <div className="pt-6 border-t border-slate-100">
                                        <label className={`${sectionLabel} flex items-center gap-2`}>
                                            <Layers size={14} className="text-indigo-500" />
                                            Group Label
                                        </label>
                                        <div className="space-y-2">
                                            <input
                                                type="text"
                                                value={groupLabelInput}
                                                onChange={(e) => setGroupLabelInput(e.target.value)}
                                                placeholder="Enter label for color..."
                                                className={textInput}
                                            />
                                            <button
                                                onClick={applyGroupLabel}
                                                className="w-full flex items-center justify-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-2 rounded-xl text-xs transition-all border border-indigo-200"
                                            >
                                                Apply to {WELL_COLORS.find(c => c.value === selectedColor)?.name} wells
                                            </button>
                                        </div>
                                    </div>

                                    {/* Individual Metadata Editor */}
                                    <div className="pt-6 border-t border-slate-100">
                                        <label className={sectionLabel}>Well Attributes</label>
                                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                            {activeWell ? (
                                                <div className="space-y-3">
                                                    <div className="flex items-center justify-between">
                                                        <span className="text-sm font-black text-indigo-600">
                                                            {plates[activeWell.plate]?.name} · {activeWell.id}
                                                        </span>
                                                        <div className="w-3 h-3 rounded-full" style={{ backgroundColor: activeData?.color || BLANK }}></div>
                                                    </div>
                                                    <input
                                                        type="text"
                                                        value={activeData?.label || ''}
                                                        onChange={handleLabelChange}
                                                        placeholder="Enter Label..."
                                                        className={`${textInput} bg-white`}
                                                    />
                                                </div>
                                            ) : (
                                                <p className="text-xs text-slate-400 text-center py-4">Select a well to edit labels</p>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                {/* Actions */}
                                <div className="mt-8 space-y-3">
                                    <button
                                        onClick={downloadAsImage}
                                        disabled={isExporting}
                                        className="w-full flex items-center justify-center gap-2 bg-slate-900 hover:bg-black text-white font-bold py-3.5 rounded-2xl transition-all active:scale-95 disabled:opacity-50"
                                    >
                                        <ImageIcon size={18} />
                                        {isExporting ? 'Generating...' : 'Export Image'}
                                    </button>

                                    <div className="grid grid-cols-2 gap-2">
                                        <button
                                            onClick={exportToCSV}
                                            className="flex items-center justify-center gap-2 bg-white border border-slate-200 hover:border-indigo-400 text-slate-700 font-bold py-3 rounded-2xl transition-all"
                                        >
                                            <FileText size={16} />
                                            CSV Out
                                        </button>
                                        <button
                                            onClick={() => fileInputRef.current.click()}
                                            className="flex items-center justify-center gap-2 bg-white border border-slate-200 hover:border-indigo-400 text-slate-700 font-bold py-3 rounded-2xl transition-all"
                                        >
                                            <Upload size={16} />
                                            CSV In
                                        </button>
                                        <input
                                            type="file"
                                            ref={fileInputRef}
                                            onChange={importFromCSV}
                                            accept=".csv"
                                            className="hidden"
                                        />
                                    </div>

                                    <button
                                        onClick={exportWorkOrder}
                                        disabled={legend.length === 0}
                                        className="w-full flex items-center justify-center gap-2 bg-white border border-slate-200 hover:border-indigo-400 text-slate-700 font-bold py-3 rounded-2xl transition-all disabled:opacity-40"
                                        title={`Seed ${design.seed} でプレート順・ウェル順をランダム化`}
                                    >
                                        <Shuffle size={16} />
                                        Work Order CSV
                                    </button>

                                    <button
                                        onClick={resetPlates}
                                        className="w-full flex items-center justify-center gap-2 text-rose-500 hover:bg-rose-50 font-bold py-2 rounded-xl transition-all mt-2"
                                    >
                                        <RotateCcw size={16} />
                                        Clear All Plates
                                    </button>
                                </div>
                            </div>
                        </aside>

                        {/* Main Viewport */}
                        <main className="lg:col-span-9">
                            <div className="bg-white p-6 md:p-12 rounded-[3rem] shadow-sm border border-slate-200 min-h-[700px] relative overflow-hidden">

                                <div className="absolute top-0 left-0 w-full h-2 bg-indigo-600"></div>

                                <div ref={plateRef} className="bg-white p-8">
                                    {/* Header for PNG Export only */}
                                    <div className="show-on-export mb-8 text-center">
                                        <h2 className="text-2xl font-black text-slate-900">{plateSize}-Well Experimental Layout</h2>
                                        <p className="text-slate-400 font-medium">
                                            {plates.length} plate{plates.length > 1 ? 's' : ''}{designNote ? ` · ${designNote}` : ''} • {new Date().toDateString()}
                                        </p>
                                    </div>

                                    {legend.length > 0 && (
                                        <div className="mb-8">
                                            <Legend entries={legend} />
                                        </div>
                                    )}

                                    <div className="flex flex-wrap justify-center gap-8">
                                        {plates.map((plate, i) => (
                                            <PlateGrid
                                                key={i}
                                                plate={plate}
                                                plateIndex={i}
                                                plateSize={plateSize}
                                                activeId={activeWell?.plate === i ? activeWell.id : null}
                                                canRemove={plates.length > 1}
                                                onWellPointerDown={handleWellPointerDown}
                                                onWellPointerEnter={handleWellPointerEnter}
                                                onRename={renamePlate}
                                                onRemove={removePlate}
                                            />
                                        ))}
                                    </div>
                                </div>

                                <div className="flex justify-center">
                                    <button
                                        onClick={addPlate}
                                        className="flex items-center gap-2 text-sm font-bold text-indigo-600 hover:bg-indigo-50 px-4 py-2 rounded-xl"
                                    >
                                        + Add Plate
                                    </button>
                                </div>

                                <BalancePanel balance={balance} />
                            </div>

                            <div className="mt-8 flex justify-between items-center px-4">
                                <div className="flex gap-6">
                                    <div className="flex flex-col">
                                        <span className="text-[10px] font-black text-slate-400 uppercase">Format</span>
                                        <span className="text-sm font-bold">{plateSize} Standard Well × {plates.length}</span>
                                    </div>
                                    <div className="flex flex-col">
                                        <span className="text-[10px] font-black text-slate-400 uppercase">Occupancy</span>
                                        <span className="text-sm font-bold text-indigo-600">{occupancy} Positions</span>
                                    </div>
                                </div>
                                <div className="text-[11px] font-bold text-slate-300 flex items-center gap-2">
                                    <div className={`w-2 h-2 rounded-full ${isDragging ? 'bg-orange-400 animate-pulse' : 'bg-indigo-400'}`}></div>
                                    {isDragging ? 'PAINTING MODE' : 'SYSTEM READY'}
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
