<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plate Designer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .show-on-export { display: none; }
        @media screen {
            .html2canvas-container .show-on-export { 
                display: block !important; 
            }
        }
        .select-none {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Lucide Icons as React Components ---
        const FlaskConical = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M10 2v8L4.5 20.29A2 2 0 0 0 6 23h12a2 2 0 0 0 1.5-2.71L14 10V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>
            </svg>
        );
        const Layers = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/>
            </svg>
        );
        const ImageIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
            </svg>
        );
        const FileText = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/>
            </svg>
        );
        const Upload = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
        );
        const RotateCcw = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
            </svg>
        );

        const PLATE_CONFIGS = {
            6: { rows: 2, cols: 3 },
            12: { rows: 3, cols: 4 },
            24: { rows: 4, cols: 6 },
            48: { rows: 6, cols: 8 },
            96: { rows: 8, cols: 12 }
        };

        const WELL_COLORS = [
            { name: 'Blank', value: '#ffffff' },
            { name: 'Red', value: '#ef4444' },
            { name: 'Blue', value: '#3b82f6' },
            { name: 'Green', value: '#22c55e' },
            { name: 'Yellow', value: '#eab308' },
            { name: 'Purple', value: '#a855f7' },
            { name: 'Orange', value: '#f97316' },
            { name: 'Pink', value: '#ec4899' },
            { name: 'Cyan', value: '#06b6d4' },
            { name: 'Indigo', value: '#6366f1' },
        ];

        const App = () => {
            const [plateSize, setPlateSize] = useState(24);
            const [selectedColor, setSelectedColor] = useState(WELL_COLORS[1].value);
            const [wells, setWells] = useState({}); 
            const [activeWellId, setActiveWellId] = useState(null);
            const [isExporting, setIsExporting] = useState(false);
            const [isDragging, setIsDragging] = useState(false);
            const [groupLabelInput, setGroupLabelInput] = useState('');
            
            const plateRef = useRef(null);
            const fileInputRef = useRef(null);

            const config = PLATE_CONFIGS[plateSize];
            const rowLabels = Array.from({ length: config.rows }, (_, i) => String.fromCharCode(65 + i));
            const colLabels = Array.from({ length: config.cols }, (_, i) => i + 1);

            useEffect(() => {
                const handleGlobalMouseUp = () => setIsDragging(false);
                window.addEventListener('mouseup', handleGlobalMouseUp);
                return () => window.removeEventListener('mouseup', handleGlobalMouseUp);
            }, []);

            const updateWellColor = (id, color) => {
                setWells((prev) => ({
                    ...prev,
                    [id]: {
                        ...prev[id],
                        color: color,
                        label: prev[id]?.label || ''
                    }
                }));
            };

            const handleWellMouseDown = (id) => {
                setIsDragging(true);
                setActiveWellId(id);
                const newColor = wells[id]?.color === selectedColor && selectedColor !== '#ffffff' ? '#ffffff' : selectedColor;
                updateWellColor(id, newColor);
            };

            const handleWellMouseEnter = (id) => {
                if (isDragging) {
                    updateWellColor(id, selectedColor);
                }
            };

            const handleLabelChange = (e) => {
                if (!activeWellId) return;
                const value = e.target.value;
                setWells((prev) => ({
                    ...prev,
                    [activeWellId]: {
                        ...prev[activeWellId],
                        label: value
                    }
                }));
            };

            const applyGroupLabel = () => {
                if (selectedColor === '#ffffff') {
                    return;
                }
                setWells((prev) => {
                    const next = { ...prev };
                    Object.keys(next).forEach((id) => {
                        if (next[id].color === selectedColor) {
                            next[id].label = groupLabelInput;
                        }
                    });
                    return next;
                });
                setGroupLabelInput('');
            };

            const resetPlate = () => {
                if (confirm('プレートをリセットしてもよろしいですか？すべてのデータが消去されます。')) {
                    setWells({});
                    setActiveWellId(null);
                }
            };

            const exportToCSV = () => {
                const headers = ["Well_ID", "Color_HEX", "Label"];
                const csvContent = [
                    headers.join(","),
                    ...Object.entries(wells)
                        .filter(([_, data]) => data.color !== '#ffffff' || data.label !== '')
                        .map(([id, data]) => `${id},${data.color},"${(data.label || "").replace(/"/g, '""')}"`)
                ].join("\n");

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `plate_layout_${plateSize}well_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
            };

            const importFromCSV = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    const lines = text.split(/\r?\n/);
                    const newWells = {};
                    
                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        const [id, color, label] = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                        if (id) {
                            newWells[id] = {
                                color: color || '#ffffff',
                                label: label ? label.replace(/^"|"$/g, '').replace(/""/g, '"') : ''
                            };
                        }
                    }
                    setWells(newWells);
                };
                reader.readAsText(file);
                event.target.value = null; 
            };

            const downloadAsImage = async () => {
                setIsExporting(true);
                if (!window.html2canvas) {
                    const script = document.createElement('script');
                    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                    document.head.appendChild(script);
                    await new Promise((resolve) => (script.onload = resolve));
                }

                try {
                    const canvas = await window.html2canvas(plateRef.current, {
                        backgroundColor: '#ffffff',
                        scale: 2,
                        logging: false,
                    });
                    const link = document.createElement('a');
                    link.download = `plate_image_${plateSize}well.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                } catch (err) {
                    console.error('Image export failed', err);
                } finally {
                    setIsExporting(false);
                }
            };

            return (
                <div className="min-h-screen bg-[#f8fafc] text-[#1e293b] p-4 md:p-8 font-sans select-none">
                    <div className="max-w-[1600px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
                        
                        {/* Sidebar */}
                        <aside className="lg:col-span-3 space-y-6">
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                                <div className="flex items-center gap-3 mb-8">
                                    <div className="p-2 bg-indigo-600 rounded-lg text-white">
                                        <FlaskConical size={24} />
                                    </div>
                                    <h1 className="text-xl font-bold tracking-tight">Plate Designer</h1>
                                </div>
                                
                                <div className="space-y-6">
                                    {/* Format Selection */}
                                    <div>
                                        <label className="text-[11px] font-black text-slate-400 uppercase mb-3 block tracking-widest">Plate Format</label>
                                        <div className="grid grid-cols-3 gap-2">
                                            {[6, 12, 24, 48, 96].map((size) => (
                                                <button
                                                    key={size}
                                                    onClick={() => setPlateSize(size)}
                                                    className={`py-2.5 rounded-xl text-sm font-bold transition-all ${
                                                        plateSize === size 
                                                            ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200 scale-105' 
                                                            : 'bg-slate-50 text-slate-500 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    {size}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Palette */}
                                    <div className="pt-6 border-t border-slate-100">
                                        <label className="text-[11px] font-black text-slate-400 uppercase mb-3 block tracking-widest">Active Color</label>
                                        <div className="grid grid-cols-5 gap-3">
                                            {WELL_COLORS.map((color) => (
                                                <button
                                                    key={color.value}
                                                    onClick={() => setSelectedColor(color.value)}
                                                    className={`w-full aspect-square rounded-full border-4 transition-all hover:scale-110 ${
                                                        selectedColor === color.value ? 'border-indigo-100 ring-2 ring-indigo-600' : 'border-transparent shadow-inner'
                                                    }`}
                                                    style={{ backgroundColor: color.value }}
                                                    title={color.name}
                                                />
                                            ))}
                                        </div>
                                    </div>

                                    {/* Group Label */}
                                    <div className="pt-6 border-t border-slate-100">
                                        <label className="text-[11px] font-black text-slate-400 uppercase mb-3 block tracking-widest flex items-center gap-2">
                                            <Layers size={14} className="text-indigo-500" />
                                            Group Label
                                        </label>
                                        <div className="space-y-2">
                                            <input
                                                type="text"
                                                value={groupLabelInput}
                                                onChange={(e) => setGroupLabelInput(e.target.value)}
                                                placeholder="Enter label for color..."
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm"
                                                onMouseDown={(e) => e.stopPropagation()}
                                            />
                                            <button
                                                onClick={applyGroupLabel}
                                                className="w-full flex items-center justify-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-2 rounded-xl text-xs transition-all border border-indigo-200"
                                            >
                                                Apply to {WELL_COLORS.find(c => c.value === selectedColor)?.name} wells
                                            </button>
                                        </div>
                                    </div>

                                    {/* Individual Metadata Editor */}
                                    <div className="pt-6 border-t border-slate-100">
                                        <label className="text-[11px] font-black text-slate-400 uppercase mb-3 block tracking-widest">Well Attributes</label>
                                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                            {activeWellId ? (
                                                <div className="space-y-3">
                                                    <div className="flex items-center justify-between">
                                                        <span className="text-sm font-black text-indigo-600">ID: {activeWellId}</span>
                                                        <div className="w-3 h-3 rounded-full" style={{ backgroundColor: wells[activeWellId]?.color || '#fff' }}></div>
                                                    </div>
                                                    <input
                                                        type="text"
                                                        value={wells[activeWellId]?.label || ''}
                                                        onChange={handleLabelChange}
                                                        placeholder="Enter Label..."
                                                        className="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm"
                                                        onMouseDown={(e) => e.stopPropagation()}
                                                    />
                                                </div>
                                            ) : (
                                                <p className="text-xs text-slate-400 text-center py-4">Select a well to edit labels</p>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                {/* Actions */}
                                <div className="mt-8 space-y-3">
                                    <button
                                        onClick={downloadAsImage}
                                        disabled={isExporting}
                                        className="w-full flex items-center justify-center gap-2 bg-slate-900 hover:bg-black text-white font-bold py-3.5 rounded-2xl transition-all active:scale-95 disabled:opacity-50"
                                    >
                                        <ImageIcon size={18} />
                                        {isExporting ? 'Generating...' : 'Export Image'}
                                    </button>
                                    
                                    <div className="grid grid-cols-2 gap-2">
                                        <button
                                            onClick={exportToCSV}
                                            className="flex items-center justify-center gap-2 bg-white border border-slate-200 hover:border-indigo-400 text-slate-700 font-bold py-3 rounded-2xl transition-all"
                                        >
                                            <FileText size={16} />
                                            CSV Out
                                        </button>
                                        <button
                                            onClick={() => fileInputRef.current.click()}
                                            className="flex items-center justify-center gap-2 bg-white border border-slate-200 hover:border-indigo-400 text-slate-700 font-bold py-3 rounded-2xl transition-all"
                                        >
                                            <Upload size={16} />
                                            CSV In
                                        </button>
                                        <input 
                                            type="file" 
                                            ref={fileInputRef} 
                                            onChange={importFromCSV} 
                                            accept=".csv" 
                                            className="hidden" 
                                        />
                                    </div>

                                    <button
                                        onClick={resetPlate}
                                        className="w-full flex items-center justify-center gap-2 text-rose-500 hover:bg-rose-50 font-bold py-2 rounded-xl transition-all mt-2"
                                    >
                                        <RotateCcw size={16} />
                                        Clear Plate
                                    </button>
                                </div>
                            </div>
                        </aside>

                        {/* Main Viewport */}
                        <main className="lg:col-span-9">
                            <div className="bg-white p-6 md:p-12 rounded-[3rem] shadow-sm border border-slate-200 min-h-[700px] flex flex-col items-center justify-center relative overflow-hidden">
                                
                                <div className="absolute top-0 left-0 w-full h-2 bg-indigo-600"></div>

                                <div ref={plateRef} className="bg-white p-8">
                                    {/* Header for PNG Export only */}
                                    <div className="hidden show-on-export mb-8 text-center">
                                        <h2 className="text-2xl font-black text-slate-900">{plateSize}-Well Experimental Layout</h2>
                                        <p className="text-slate-400 font-medium">Generated via Professional Plate Designer • {new Date().toDateString()}</p>
                                    </div>

                                    <div className="inline-block">
                                        {/* Column Labels */}
                                        <div className="flex mb-4 ml-12">
                                            {colLabels.map((col) => (
                                                <div 
                                                    key={col} 
                                                    className="text-center font-black text-slate-300 text-sm tracking-tighter"
                                                    style={{ width: plateSize > 48 ? '44px' : plateSize > 24 ? '56px' : '72px' }}
                                                >
                                                    {col}
                                                </div>
                                            ))}
                                        </div>

                                        {/* Grid */}
                                        {rowLabels.map((row) => (
                                            <div key={row} className="flex items-center mb-4 last:mb-0">
                                                <div className="w-12 font-black text-slate-300 text-xl">{row}</div>
                                                
                                                <div className="flex gap-2">
                                                    {colLabels.map((col) => {
                                                        const id = `${row}${col}`;
                                                        const wellData = wells[id] || { color: '#ffffff', label: '' };
                                                        const isActive = activeWellId === id;
                                                        
                                                        const wellClass = plateSize > 48 ? 'w-10 h-10' : plateSize > 24 ? 'w-12 h-12' : 'w-16 h-16';
                                                        const labelClass = plateSize > 48 ? 'text-[7px]' : 'text-[9px]';

                                                        return (
                                                            <div key={id} className="relative flex flex-col items-center">
                                                                <button
                                                                    onMouseDown={() => handleWellMouseDown(id)}
                                                                    onMouseEnter={() => handleWellMouseEnter(id)}
                                                                    className={`
                                                                        ${wellClass} rounded-full border-2 transition-all duration-150 
                                                                        flex flex-col items-center justify-center relative shadow-sm cursor-crosshair
                                                                        ${isActive ? 'ring-4 ring-indigo-100 border-indigo-600 scale-110 z-20' : 'border-slate-100 hover:border-slate-300'}
                                                                    `}
                                                                    style={{ backgroundColor: wellData.color }}
                                                                >
                                                                    <span className={`
                                                                        ${plateSize > 48 ? 'text-[8px]' : 'text-[10px]'} font-bold select-none
                                                                        ${wellData.color === '#ffffff' ? 'text-slate-200' : 'text-white drop-shadow-md'}
                                                                    `}>
                                                                        {id}
                                                                    </span>
                                                                </button>
                                                                {/* Visual Label */}
                                                                {wellData.label && (
                                                                    <div className={`
                                                                        absolute top-[105%] w-16 text-center leading-tight font-bold text-slate-500 truncate
                                                                        ${labelClass}
                                                                    `}>
                                                                        {wellData.label}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                            
                            <div className="mt-8 flex justify-between items-center px-4">
                                <div className="flex gap-6">
                                    <div className="flex flex-col">
                                        <span className="text-[10px] font-black text-slate-400 uppercase">Format</span>
                                        <span className="text-sm font-bold">{plateSize} Standard Well</span>
                                    </div>
                                    <div className="flex flex-col">
                                        <span className="text-[10px] font-black text-slate-400 uppercase">Occupancy</span>
                                        <span className="text-sm font-bold text-indigo-600">{Object.keys(wells).filter(k => wells[k].color !== '#ffffff').length} Positions</span>
                                    </div>
                                </div>
                                <div className="text-[11px] font-bold text-slate-300 flex items-center gap-2">
                                    <div className={`w-2 h-2 rounded-full ${isDragging ? 'bg-orange-400 animate-pulse' : 'bg-indigo-400'}`}></div>
                                    {isDragging ? 'PAINTING MODE' : 'SYSTEM READY'}
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
